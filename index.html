
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC Games</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="logo">GC<span>GAMES</span></div>

        <nav>
            <a href="index.html">⌂</a>
            <a href="#">●</a>
            <a href="index.html" class="active">🎮</a>
            <a href="#">♫</a>
            <a href="settings.html">⚙</a>
            <a href="#">◉</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main>

        <div class="search">
            <input
                type="text"
                id="gameSearch"
                placeholder="Search games..."
                autocomplete="off"
            >
        </div>

        <h2>ALL GAMES</h2>

        <section class="game-grid" id="gameGrid">

            <!-- CHESS -->
            <a class="game-card" href="games/chess/index.html">
                <div class="game-image">
                    <img src="images/games/chess.jpg" alt="Chess">
                </div>
                <h3>CHESS</h3>
            </a>

            <!-- COMING SOON 1 -->
            <div class="game-card coming-soon">
                <div class="game-image">
                    <div class="coming-soon-content">
                        <span>🔒</span>
                        <p>COMING SOON</p>
                    </div>
                </div>
                <h3>COMING SOON</h3>
            </div>

            <!-- COMING SOON 2 -->
            <div class="game-card coming-soon">
                <div class="game-image">
                    <div class="coming-soon-content">
                        <span>🔒</span>
                        <p>COMING SOON</p>
                    </div>
                </div>
                <h3>COMING SOON</h3>
            </div>

            <!-- COMING SOON 3 -->
            <div class="game-card coming-soon">
                <div class="game-image">
                    <div class="coming-soon-content">
                        <span>🔒</span>
                        <p>COMING SOON</p>
                    </div>
                </div>
                <h3>COMING SOON</h3>
            </div>

            <!-- COMING SOON 4 -->
            <div class="game-card coming-soon">
                <div class="game-image">
                    <div class="coming-soon-content">
                        <span>🔒</span>
                        <p>COMING SOON</p>
                    </div>
                </div>
                <h3>COMING SOON</h3>
            </div>

        </section>

        <p id="noResults" style="display:none; color:#888; margin-top:30px;">
            No games found.
        </p>

    </main>

    <!-- BOTTOM BAR -->
    <footer class="bottom-nav">
        <div class="footer-logo">GC</div>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
