
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC Games</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">GC<span>GAMES</span></div>

    <nav>
        <a href="index.html">⌂</a>
        <a href="#">●</a>
        <a href="index.html" class="active">🎮</a>
        <a href="#">♫</a>
        <a href="settings.html">⚙</a>
        <a href="#">◉</a>
    </nav>
</header>

<main>

        <input type="text" id="gameSearch"
        placeholder="Search games...">
    </div>

    <h2>ALL GAMES</h2>

    <section class="game-grid" id="gameGrid">

        <div class="game-card">
            <img src="images/games/game1.jpg" alt="Game 1">

        </div>

        <div class="game-card">
            <img src="images/games/game2.jpg" alt="Game 2">
            <h3>GAME TWO</h3>
        </div>

        <div class="game-card">
            <img src="images/games/game3.jpg" alt="Game 3">
            <h3>GAME THREE</h3>
        </div>

        <div class="game-card">
            <img src="images/games/game4.jpg" alt="Game 4">
            <h3>GAME FOUR</h3>
        </div>

    </section>
</main>

<footer class="bottom-nav">
    <div class="footer-logo">GC</div>
</footer>

<script src="js/script.js"></script>

</body>
</html>
